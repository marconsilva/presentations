<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentations | Marco Silva</title>
  <link rel="stylesheet" href="./assets/css/homepage.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>Presentations</h1>
      <p class="tagline">A collection of talks and presentations on software engineering, architecture, and technology.</p>
    </div>
  </header>

  <main class="presentations-section">
    <div class="section-header">
      <h2 class="section-title">All Presentations</h2>
      <button id="filter-btn" class="filter-btn" aria-label="Filter by tags">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
        <span>Filter</span>
        <span id="filter-count" class="filter-count" hidden>0</span>
      </button>
    </div>
    <div id="filter-popup" class="filter-popup" hidden>
      <div class="filter-popup-header">
        <h3>Filter by Tags</h3>
        <button id="filter-clear" class="filter-clear-btn">Clear all</button>
      </div>
      <div id="filter-tags" class="filter-tags"></div>
    </div>
    <div id="presentations-grid" class="presentations-grid">
      <div class="empty-state">
        <p>Loading presentations...</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Built with ❤️ — Powered by GitHub Pages</p>
  </footer>

  <script src="./assets/js/homepage.js"></script>
</body>
</html>
