<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | Presentations</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    
    :root {
      --bg: #0d1117;
      --bg-card: #1c2128;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #e94560;
      --border: rgba(139, 148, 158, 0.2);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      padding: 4rem 2rem;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      transition: color 0.2s;
    }
    
    .back-link:hover { color: var(--text); }
    
    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      line-height: 1.2;
      background: linear-gradient(135deg, var(--text), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .abstract {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.8;
    }
    
    .cta-buttons {
      display: flex;
      gap: 1rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }
    
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }
    
    .section {
      margin-bottom: 2.5rem;
    }
    
    .section h2 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--accent);
    }
    
    .events-list {
      list-style: none;
    }
    
    .events-list li {
      padding: 1rem 1.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .event-name {
      font-weight: 600;
    }
    
    .event-date {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    
    .tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    
    .tag {
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      background: rgba(233, 69, 96, 0.15);
      color: var(--accent);
      border: 1px solid rgba(233, 69, 96, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="../../" class="back-link">← All Presentations</a>
    
    <h1>{{TITLE}}</h1>
    
    <div class="tags">
      <!-- {{TAGS}} -->
    </div>
    
    <p class="abstract">{{ABSTRACT}}</p>
    
    <div class="cta-buttons">
      <a href="./slides.html" class="btn btn-primary">▶ View Slides</a>
      <!-- <a href="{{REPO_URL}}" class="btn btn-secondary">💻 Demo Repository</a> -->
    </div>
    
    <!-- Events Section (uncomment when events exist) -->
    <!--
    <div class="section">
      <h2>🎤 Presented At</h2>
      <ul class="events-list">
        <li>
          <span class="event-name">Event Name</span>
          <span class="event-date">Month Year</span>
        </li>
      </ul>
    </div>
    -->
  </div>
</body>
</html>
